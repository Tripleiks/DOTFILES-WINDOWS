# yazi.toml — Yazi configuration
#
# Reference: https://yazi-rs.github.io/docs/configuration/yazi
#
# This file is symlinked from the repo into %APPDATA%\yazi\config\yazi.toml
# by Yazi\install.ps1. Edit here, never in %APPDATA%.
#
# Only the bits we actually want to override are listed. Yazi's preset
# (https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml)
# fills in everything else — including the [opener] commands for Windows
# (start "", explorer /select,, ya pub extract) and the [plugin].previewers
# list that maps text/* → code (syntax-highlighted preview).
#
# Schema notes for the next time you edit:
#   - [open.rules] uses url = "<glob>", NOT name = "<glob>" (renamed in v26).
#   - [opener] run commands use printf-style placeholders: %s (paths,
#     space-separated), %s1 (first path), %S (URL form), %d1 (dir of first).
#     NOT POSIX-shell $@ / $0 / $1.

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "none"
show_hidden    = false
show_symlink   = true

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
image_delay   = 30
image_filter  = "triangle"
image_quality = 75
