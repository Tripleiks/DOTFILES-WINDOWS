# yazi.toml — Yazi configuration
#
# Reference: https://yazi-rs.github.io/docs/configuration/yazi
#
# This file is symlinked from the repo into %APPDATA%\yazi\config\yazi.toml
# by Yazi\install.ps1. Edit here, never in %APPDATA%.

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "none"
show_hidden    = false
show_symlink   = true

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
image_delay   = 30
image_filter  = "triangle"
image_quality = 75

[opener]
edit = [
    { run = '$env:EDITOR "$@"', orphan = true, desc = "$EDITOR", for = "windows" },
]
open = [
    { run = 'explorer.exe "$0"', orphan = true, desc = "Open with default app", for = "windows" },
]
reveal = [
    { run = 'explorer.exe /select,"$0"', orphan = true, desc = "Reveal in Explorer", for = "windows" },
]
extract = [
    { run = '7z x -y "$@"', desc = "Extract here (7-Zip)", for = "windows" },
]

[open]
rules = [
    { name = "*/",                          use = ["open", "reveal"] },
    { mime = "text/*",                      use = ["edit", "open"] },
    { mime = "image/*",                     use = ["open", "reveal"] },
    { mime = "video/*",                     use = ["open", "reveal"] },
    { mime = "audio/*",                     use = ["open", "reveal"] },
    { mime = "application/json",            use = ["edit", "open"] },
    { mime = "application/zip",             use = ["extract", "open"] },
    { mime = "application/x-7z-compressed", use = ["extract", "open"] },
    { mime = "application/x-tar",           use = ["extract", "open"] },
    { mime = "application/x-bzip2",         use = ["extract", "open"] },
    { mime = "application/x-rar",           use = ["extract", "open"] },
    { mime = "application/x-gzip",          use = ["extract", "open"] },
    { name = "*",                           use = ["open", "reveal"] },
]
